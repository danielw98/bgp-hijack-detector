# student-dev.ro/bgp - the BGP hijack detector (BGPWatch), container app-bgpwatch:8080 on
# studlab_net. Lives in the apex vhost through `include conf.d/apex.d/*.conf`; the app runs
# with PATH_BASE=/bgp, so the prefix passes through unchanged. Ships to
# ~admin/data/studlab/nginx/conf.d/apex.d/bgp.conf with infra scripts/deploy_bgp.ps1 --vhost.
# Variable upstream: nginx reloads even while the container is down.

location = /bgp { return 301 /bgp/; }

location ^~ /bgp/ {
    set $bgp http://app-bgpwatch:8080;
    proxy_pass $bgp;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 120;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The demo's traffic stays out of the apex's own access file.
    access_log /dev/stdout json;
}
