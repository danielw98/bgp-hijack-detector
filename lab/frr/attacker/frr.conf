frr version 10.4
frr defaults traditional
hostname attacker
log stdout
!
! AS 65003 starts benign: it has a BGP session to transit but announces nothing.
! The hijack is injected live at demo time (see lab/trigger-hijack.sh), so the
! baseline and the attack are both observable in one run.
router bgp 65003
 bgp router-id 10.10.0.13
 no bgp ebgp-requires-policy
 neighbor 10.10.0.10 remote-as 65000
 !
 address-family ipv4 unicast
  neighbor 10.10.0.10 activate
 exit-address-family
!
