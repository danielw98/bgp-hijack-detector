frr version 10.4
frr defaults traditional
hostname victim
log stdout
!
! AS 65001 is the legitimate holder of 203.0.113.0/24 (RFC 5737 documentation prefix).
! A blackhole static gives zebra a route the "network" statement can originate.
! Two hosts of the prefix live on the loopback, one inside the sub-prefix the attacker
! announces (203.0.113.0/25) and one outside it, so the kernel delivers them here while
! the rest of the prefix stays blackholed.
ip route 203.0.113.0/24 Null0
!
interface lo
 ip address 203.0.113.1/32
 ip address 203.0.113.129/32
!
router bgp 65001
 bgp router-id 10.10.0.11
 no bgp ebgp-requires-policy
 neighbor 10.10.0.10 remote-as 65000
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  neighbor 10.10.0.10 activate
 exit-address-family
 !
 bmp targets station
  bmp connect 10.10.0.100 port 5000 min-retry 1000 max-retry 5000
  bmp monitor ipv4 unicast loc-rib
 exit
!
