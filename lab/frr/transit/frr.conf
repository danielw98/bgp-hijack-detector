frr version 10.4
frr defaults traditional
hostname transit
log stdout
!
! AS 65000 is the transit provider. It peers with the victim and the attacker and
! propagates whatever each one announces, exactly as a real upstream would.
router bgp 65000
 bgp router-id 10.10.0.10
 no bgp ebgp-requires-policy
 neighbor 10.10.0.11 remote-as 65001
 neighbor 10.10.0.13 remote-as 65003
 !
 address-family ipv4 unicast
  neighbor 10.10.0.11 activate
  neighbor 10.10.0.13 activate
 exit-address-family
 !
 bmp targets station
  bmp connect 10.10.0.100 port 5000 min-retry 1000 max-retry 5000
  bmp monitor ipv4 unicast loc-rib
 exit
!
! Origin validation: the RPKI cache lab-rtr serves the ROA 203.0.113.0/24, maxLength
! 24, AS65001. Route-map ROV drops the routes whose state is invalid. It is applied to
! no session here: the lab starts accepting everything, and POST /api/lab/rov applies
! it to the attacker's session (neighbor 10.10.0.13 route-map ROV in) or removes it.
rpki
 rpki polling_period 30
 rpki cache tcp 10.10.0.20 8282 preference 1
exit
!
route-map ROV deny 10
 match rpki invalid
exit
!
route-map ROV permit 20
exit
!
