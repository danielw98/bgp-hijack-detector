name: bgp-hijack-app

# The detection stack: Postgres for route history and alerts, and the app (BGPWatch):
# the BMP station the FRR lab routers report to, the detector, the loader that puts
# the recorded 2008 incident into the database once, and the dashboard. The lab's
# internal network is joined as an external network (bring the lab up first:
# cd lab && docker compose up -d).

networks:
  labnet:
    external: true
    name: bgp-hijack-lab_labnet
  appnet:
    driver: bridge

volumes:
  pgdata:

services:
  db:
    image: postgres:16-alpine
    container_name: app-db
    environment:
      POSTGRES_USER: bgp
      POSTGRES_PASSWORD: bgp
      POSTGRES_DB: bgp
    networks:
      - appnet
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bgp -d bgp"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
    image: bgp-hijack-app
    container_name: app-bgpwatch
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__BGPWatch: Host=db;Username=bgp;Password=bgp;Database=bgp
      LAB_CONTROL: "1"
      LAB_ATTACKER_CONTAINER: lab-attacker
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./src/BGPWatch.Web/wwwroot:/app/wwwroot:ro
      - ./detector/config.toml:/data/config.toml:ro
      - ./detector/incidents:/data/incidents:ro
      - ./detector/schema.sql:/data/schema.sql:ro
    networks:
      labnet:
        ipv4_address: 10.10.0.100
      appnet:
