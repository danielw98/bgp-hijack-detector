name: bgp-hijack-app

# The detection stack: a route collector (exabgp + bgpwatch) peering with the FRR lab,
# Postgres for route history and alerts, and the dashboard. The lab's internal network is joined as
# an external network (bring the lab up first: cd lab && docker compose up -d).

networks:
  labnet:
    external: true
    name: bgp-hijack-lab_labnet
  appnet:
    driver: bridge

volumes:
  pgdata:

services:
  db:
    image: postgres:16-alpine
    container_name: app-db
    environment:
      POSTGRES_USER: bgp
      POSTGRES_PASSWORD: bgp
      POSTGRES_DB: bgp
    networks:
      - appnet
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bgp -d bgp"]
      interval: 3s
      timeout: 3s
      retries: 20

  collector:
    build:
      context: .
      dockerfile: detector/Dockerfile
    container_name: app-collector
    depends_on:
      db:
        condition: service_healthy
    environment:
      BGPWATCH_DATABASE_URL: postgresql://bgp:bgp@db:5432/bgp
    volumes:
      - ./detector/exabgp.conf:/etc/exabgp/exabgp.conf:ro
      - ./detector/bgpwatch:/opt/bgpwatch/bgpwatch:ro
      - ./detector/config.toml:/opt/bgpwatch/config.toml:ro
      - ./detector/incidents:/opt/bgpwatch/incidents:ro
      - ./detector/schema.sql:/opt/bgpwatch/schema.sql:ro
    networks:
      labnet:
        ipv4_address: 10.10.0.100
      appnet:

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: app-dashboard
    depends_on:
      db:
        condition: service_healthy
    environment:
      BGPWATCH_DATABASE_URL: postgresql://bgp:bgp@db:5432/bgp
      LAB_CONTROL: "1"
      LAB_ATTACKER_CONTAINER: lab-attacker
      COLLECTOR_CONTAINER: app-collector
    ports:
      - "8080:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dashboard/app.py:/app/app.py:ro
      - ./dashboard/templates:/app/templates:ro
    networks:
      - appnet
