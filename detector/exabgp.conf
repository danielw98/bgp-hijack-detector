process bgpwatch {
    run /opt/bgpwatch/run-process.sh;
    encoder json;
}

neighbor 10.10.0.10 {
    router-id 10.10.0.100;
    local-address 10.10.0.100;
    local-as 65100;
    peer-as 65000;
    family {
        ipv4 unicast;
    }
    api {
        processes [ bgpwatch ];
        receive {
            parsed;
            update;
        }
    }
}

